
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>قصص شام</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #fffafc;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ffd1dc;
      color: #333;
      text-align: center;
      padding: 0.6rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .heart-icon {
      font-size: 1.8rem;
      color: red;
      margin-top: 0.3rem;
    }

    nav {
      text-align: center;
      background-color: #ffe4e1;
      padding: 1rem;
    }

    nav button {
      background-color: #ffb6c1;
      border: none;
      padding: 10px 20px;
      margin: 10px 5px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 20px;
      transition: background 0.3s;
      font-family: 'Cairo', sans-serif;
    }

    nav button:hover {
      background-color: #ffa6b0;
    }

    .story-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background-color: #fff0f5;
      border-radius: 10px;
    }

    .prompt {
      background: #fff;
      border: 1px solid #ffcad4;
      border-radius: 10px;
      margin-bottom: 1rem;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: right;
    }

    .prompt img {
      width: 100%;
      max-width: 300px;
      display: block;
      margin: 10px auto;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #ffe4e1;
      font-size: 0.9rem;
      margin-top: 2rem;
    }

    .story-frame{
    width:90%;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}
  </style>
</head>
<body>

  <header>
    <h1>قصص شام</h1>
    <div class="heart-icon">❤️</div>
  </header>

  <nav>
    <button onclick="showStory(0)"> قطقوط </button>
  </nav>

  <div class="story-frame">
    <iframe 
        src="https://gemini.google.com/share/780644457ff7"
        width="100%" 
        height="700"
        frameborder="0">
    </iframe>
</div>
  
  <footer>
    بقلم 💖 شام، ١٠ سنوات
  </footer>


  <script>
  </script>

</body>

</html>
